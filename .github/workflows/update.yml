name: Update listings

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 6am EST / 7am EDT
  workflow_dispatch:
    inputs:
      county:
        description: "Only fetch this county (blank = all, for testing)"
        required: false
  push:
    branches: [main]
    paths: ["site/**"]     # site code change: redeploy with the latest data, no fetch

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
  SALT_FILE: vault/salt.txt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # hard cap so a stuck run can't keep using minutes
    steps:
      # Cost guard: Actions and Pages are free only for public repos. If this repo is ever made
      # private, stop instead of using paid minutes.
      - name: Free-tier guard
        if: github.event.repository.private
        run: |
          echo "::error::This repository is private. Actions minutes and Pages are only free for public repos, so the tracker will not run. Make the repo public again to resume."
          exit 1

      - uses: actions/checkout@v4

      - name: Check password secret
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::Add a SITE_PASSWORD secret (Settings > Secrets and variables > Actions). Nothing is published without it."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Encrypted state + last published (encrypted) data live on an orphan `data` branch (one commit, force-pushed)
      - name: Get saved state
        run: |
          mkdir -p vault state
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C vault
          fi
          if [ -f vault/state.enc ]; then
            python scripts/vault.py unpack vault/state.enc state
          elif [ -f vault/state.json ]; then
            # one-time migration from the old unencrypted state
            cp vault/*.json state/
          fi

      - name: Fetch listings
        if: github.event_name != 'push'
        env:
          COUNTY: ${{ inputs.county }}
        run: |
          if [ -f state/today.json ]; then cp state/today.json state/prev.json; fi
          if [ -n "$COUNTY" ]; then
            python scripts/fetch.py --out state/today.json --prev state/prev.json --county "$COUNTY"
          else
            python scripts/fetch.py --out state/today.json --prev state/prev.json
          fi

      - name: Build and encrypt dashboard data
        if: github.event_name != 'push'
        run: |
          python scripts/build.py --today state/today.json --state state --out site/data
          python scripts/vault.py seal-site site/data

      - name: Use last published data
        if: github.event_name == 'push'
        run: |
          if [ -f vault/site_data/crypto.json ]; then
            rm -rf site/data && cp -r vault/site_data site/data
          else
            echo "No encrypted data yet; deploying sample data"
          fi

      - name: Save encrypted state to data branch
        if: github.event_name != 'push'
        run: |
          rm -f state/prev.json
          out=$(mktemp -d)
          python scripts/vault.py pack state "$out/state.enc"
          cp "$SALT_FILE" "$out/salt.txt"
          cp -r site/data "$out/site_data"
          cd "$out"
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
